name: Update recent activity

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-activity
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update recent activity section
        env:
          GH_USERNAME: cuauhtemocbe
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/update-recent-activity.sh

      # Commits made with the default GITHUB_TOKEN don't trigger other
      # workflows (GitHub's anti-loop protection) — build-site.yml would
      # never fire after this job's own commit, silently leaving index.html
      # stale. Rebuilding here, in the same job, is what keeps them in sync.
      - name: Rebuild index.html from the updated README
        run: python3 .github/scripts/build_site.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html
          git commit -m "chore: update recent activity section"
          git push
